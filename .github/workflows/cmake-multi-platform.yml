name: CMake on multiple platforms
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:
jobs:
  build-linux:
    name: Linux (CMake)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies for SDL3 & vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          ccache \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libpipewire-0.3-dev \
          libudev-dev \
          mesa-vulkan-drivers \
          vulkan-tools
          
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, shaderc

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-vulkan-prismengine-${{ github.sha }}
          restore-keys: |
            linux-vulkan-prismengine-
            
      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build PrismEngine
        run: |
          cmake --build build
